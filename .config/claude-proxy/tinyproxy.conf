# This Mac's Tailscale IPv4 address. Never bind the proxy to all interfaces.
Listen 100.81.99.6
Port 8888

# Tailscale authenticates peers and applies the tailnet's access policy.
Allow 100.64.0.0/10
ConnectPort 443

# Preserve idle streaming connections. Outbound connections follow the Mac's
# routing table, including its selected Tailscale exit node.
Timeout 1800
MaxClients 64
LogLevel Warning
PidFile "/Users/david/.local/state/claude-proxy/tinyproxy.pid"
